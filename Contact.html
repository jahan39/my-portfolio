    </nav>
    <a href="#contact" class="nav-btn">Let's Talk <span>↗</span></a>
  </div>
</header>

<main>


  <section class="section contact" id="contact">
  <div class="container contact-box">

    <div class="contact-info">
      <p class="label">06 — CONTACT</p>

      <h2>Have a project<br>in <em>mind?</em></h2>

      <p>
        Let's turn your idea into something people remember.
      </p>

      <div class="contact-links">
        <a href="mailto:rifatofficial001@email.com">EMAIL ↗</a>
        <a href="#">Behance ↗</a>
        <a href="https://www.linkedin.com/in/rifat-h0ssain" target="_blank">
          LinkedIn ↗
        </a>
        <a href="https://www.facebook.com/share/1D5GWRHSAw" target="_blank">
          Facebook ↗
        </a>
        <a href="https://www.youtube.com/@reelgeniusbd" target="_blank">
          Youtube ↗
        </a>
      </div>
    </div>

    <!-- EmailJS Contact Form -->
    <div class="contact-form">

      <form id="contact-form">

        <div class="form-group">
          <label for="name">YOUR NAME</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">YOUR EMAIL</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="What is your project about?"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Tell me about your project..."
            required
          ></textarea>
        </div>

        <button type="submit" class="form-btn">
          Send Message <span>↗</span>
        </button>

        <p id="form-status"></p>

      </form>

    </div>

  </div>
</section>
</main>
